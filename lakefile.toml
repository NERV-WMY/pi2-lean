name = "row12_lean"
version = "1.0.0"
defaultTargets = ["Row12"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "db584cd6d46c92f209a44c0f1c829460d327499d"

[[lean_lib]]
name = "Row12"
moreLeanArgs = ["--trust=0", "-DwarningAsError=true", "-M", "8192", "-j", "1"]

[[lean_lib]]
name = "Row12EulerSupport"
moreLeanArgs = ["--trust=0", "-DwarningAsError=true", "-M", "8192", "-j", "1"]

[[lean_lib]]
name = "Row12GaussGauge"
moreLeanArgs = ["--trust=0", "-DwarningAsError=true", "-M", "8192", "-j", "1"]
